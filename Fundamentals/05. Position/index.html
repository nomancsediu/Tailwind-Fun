<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Position</title>
  </head>
  <body class="p-20">
    <div class="relative w-1/2 h-40 bg-green-200 mt-5">
      <p>Relative</p>
      <div class="absolute left-0 bottom-0 bg-teal-400 p-4">
        <p>Absolute</p>
      </div>
    </div>

    <div class="relative w-1/2 h-40 bg-green-200 mt-5">
      <p>Relative</p>
      <div class="absolute top-0 left-0 bg-teal-400 p-4 ml-5">
        <p>Absolute</p>
      </div>
    </div>
  </body>
</html>
