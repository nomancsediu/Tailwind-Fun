<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Colors</title>
  </head>
  <body class="p-20">
    <!-- Contrast -->
    <div class="border m-10 flex p-10">
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] contrast-50"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] contrast-100"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] contrast-200"
      />
    </div>
    <br />
    <hr />
    <br />

    <!-- Brightness -->

    <div class="border m-10 flex p-10">
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] brightness-50"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] brightness-100"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] brightness-200"
      />
    </div>

    <br />
    <hr />
    <br />

    <!-- Grayscale -->

    <div class="border m-10 flex p-10">
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] grayscale-50"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] grayscale-20"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] grayscale-100"
      />
    </div>
    <br />
    <hr />
    <br />

    <!-- Hue Rotate -->

    <br />
    <hr />
    <br />

    <!-- Saturate -->

    <br />
    <hr />
    <br />

    <!-- Blur -->
    <div class="border m-10 flex p-10">
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] blur-none"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] blur-lg"
      />
      <img
        src="https://wallpapers.com/images/featured/laptop-murjp1nk4lp1idlt.jpg"
        alt=""
        class="w-[250px] h-[250px] blur-md"
      />
    </div>
  </body>
</html>
