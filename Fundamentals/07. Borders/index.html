<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Colors</title>
  </head>
  <body class="p-20">
    <!-- Border Width & Colors -->
    <div class="border-2 border-green-100 m-10 flex">
      <div class="w-96 m-C3 p-5 border m-2">Border all around</div>
      <div class="w-96 m-C3 p-5 border-2 m-2">Border all around</div>
      <div class="w-96 m-C3 p-5 border-x-4 m-2">Border X Axis</div>
      <div class="w-96 m-C3 p-5 border-r-4 m-2">Border Right</div>
      <div class="w-96 m-C3 p-5 border-l-4 m-2">Border Left</div>
      <div class="w-96 m-C3 p-5 border-t-4 m-2">Border Top</div>
      <div class="w-96 m-C3 p-5 border-b-4 m-2">Border Bottom</div>
    </div>
    <br />
    <hr />
    <br />

    <!-- Border Radius -->

    <div
      class="border-2 border-green-100 m-10 flex justify-center items center"
    >
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded">
        Border Rounded
      </div>
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded-lg">
        Border Rounded
      </div>
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded-xl">
        Border Rounded
      </div>
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded-2xl">
        Border Rounded
      </div>
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded-3xl">
        Border Rounded
      </div>
      <div class="text-center w-96 m-3 p-5 bg-teal-200 rounded-full">
        Border Rounded
      </div>
    </div>
    <br />
    <hr />
    <br />
  </body>
</html>
